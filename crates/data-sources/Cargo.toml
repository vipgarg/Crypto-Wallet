[package]
name = "data-sources"
version = "0.1.0"
description = "Blockchain data providers, network config and cross-checking"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
chain-btc = { path = "../chain-btc" }
chain-eth = { path = "../chain-eth" }
chain-tron = { path = "../chain-tron" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
toml = "0.8"
wallet-types = { path = "../wallet-types" }

[features]
# Recorded-response HTTP client, for tests only.
mock = []

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }

[lints]
workspace = true
