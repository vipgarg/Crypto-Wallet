[package]
name = "wallet-core"
version = "0.1.0"
description = "Watch-only wallet registry and cross-checked portfolio"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
chain-btc = { path = "../chain-btc" }
chain-eth = { path = "../chain-eth" }
chain-tron = { path = "../chain-tron" }
data-sources = { path = "../data-sources" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
wallet-types = { path = "../wallet-types" }

[dev-dependencies]
data-sources = { path = "../data-sources", features = ["mock"] }
tokio = { version = "1", features = ["rt", "macros"] }

[lints]
workspace = true
