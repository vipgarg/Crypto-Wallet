[package]
name = "signer-ffi"
version = "0.1.0"
description = "Kotlin (Android) bindings for signer-core via UniFFI"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "signer_ffi"

[dependencies]
signer-core = { path = "../signer-core" }
thiserror = "2"
uniffi = { version = "=0.29.5" }
wallet-types = { path = "../wallet-types" }
zeroize = "1"

[lints]
workspace = true
