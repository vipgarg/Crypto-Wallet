[package]
name = "signer-ffi"
version = "0.1.0"
description = "Kotlin (Android) bindings for signer-core via UniFFI"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "signer_ffi"

[dependencies]
bitcoin = { version = "0.32", default-features = false, features = ["std"] }
chain-tron = { path = "../chain-tron" }
qrcode = { version = "0.14", default-features = false }
signer-core = { path = "../signer-core" }
tron-tx = { path = "../tron-tx" }
thiserror = "2"
uniffi = { version = "=0.29.5" }
wallet-types = { path = "../wallet-types" }
zeroize = "1"

[dev-dependencies]
btc-send = { path = "../btc-send" }

[lints]
workspace = true
