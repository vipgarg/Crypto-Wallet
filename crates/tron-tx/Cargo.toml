[package]
name = "tron-tx"
version = "0.1.0"
description = "TRON TRC-20 USDT transfer: local protobuf encoding, strict decoding, transaction id, signature check. No network, no keys."
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
chain-eth = { path = "../chain-eth" }
chain-tron = { path = "../chain-tron" }
secp256k1 = { version = "0.29", default-features = false, features = ["std", "recovery"] }
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
hex = "0.4"

[lints]
workspace = true
