[package]
name = "chain-eth"
version = "0.1.0"
description = "Ethereum (ERC-20 USDT) address handling and read-only RPC encoding"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
bitcoin = { version = "0.32", default-features = false, features = ["std", "serde"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha3 = "0.10"
thiserror = "2"

[dev-dependencies]
bip39 = "2"

[lints]
workspace = true
