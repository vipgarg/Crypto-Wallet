[package]
name = "chain-tron"
version = "0.1.0"
description = "TRON (TRC-20 USDT) address handling and read-only HTTP API encoding"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
bitcoin = { version = "0.32", default-features = false, features = ["std", "serde"] }
bs58 = { version = "0.5", features = ["check"] }
chain-eth = { path = "../chain-eth" }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
bip39 = "2"

[lints]
workspace = true
