[package]
name = "watch-wallet-app"
version = "0.1.0"
description = "Watch-only wallet desktop app (no keys)"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lib]
name = "watch_wallet_app"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.5", features = ["isolation"] }

[dependencies]
auth = { path = "../../crates/auth" }
audit-log = { path = "../../crates/audit-log" }
sys-checks = { path = "../../crates/sys-checks" }
qrcode = { version = "0.14", default-features = false }
zeroize = "1"
data-sources = { path = "../../crates/data-sources" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12", features = ["isolation"] }
tokio = { version = "1", default-features = false, features = ["time"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
wallet-core = { path = "../../crates/wallet-core" }
wallet-types = { path = "../../crates/wallet-types" }
chain-btc = { path = "../../crates/chain-btc" }
chain-eth = { path = "../../crates/chain-eth" }

[lints]
workspace = true
