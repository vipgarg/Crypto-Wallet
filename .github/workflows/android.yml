name: Android signer (testnet)

# Builds the offline signer APK for the OnePlus tablet (docs/signer-app.md).
# Each run starts from a clean GitHub runner. The APK and its SHA-256 are
# uploaded as a build artifact; check the hash before installing.

on:
  push:
    paths:
      - "android/**"
      - "crates/**"
      - "tools/uniffi-bindgen/**"
      - "Cargo.lock"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    env:
      CARGO_NDK_VERSION: "4.1.2"
      GRADLE_VERSION: "8.14.3"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Rust toolchain (pinned by rust-toolchain.toml) + Android target
        run: |
          rustup show
          rustup target add aarch64-linux-android

      - name: cargo-ndk
        run: cargo install cargo-ndk --version "$CARGO_NDK_VERSION" --locked

      - name: Rust core for the tablet (arm64-v8a, Android 10+)
        # cargo-ndk finds the runner's NDK through ANDROID_NDK_ROOT.
        run: |
          echo "NDK: $ANDROID_NDK_ROOT"
          cargo ndk -t arm64-v8a --platform 29 -o android/app/src/main/jniLibs \
            build -p signer-ffi --release --locked
          ls -l android/app/src/main/jniLibs/arm64-v8a/

      - name: Kotlin bindings (UniFFI)
        run: |
          cargo build -p signer-ffi --release --locked
          cd tools/uniffi-bindgen
          cargo run --release --locked -- generate \
            --library ../../target/release/libsigner_ffi.so \
            --language kotlin --no-format \
            --out-dir ../../android/app/src/main/java

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      # With the owner's signing key (GitHub secrets), the APK is a release
      # build signed with that fixed key, so updates install over the old app
      # and keep its wallets. Without it, a debug build (new key every run).
      - name: Build APK
        working-directory: android
        env:
          KEYSTORE_B64: ${{ secrets.SIGNER_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SIGNER_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNER_KEY_ALIAS }}
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          BT="$(ls -d "$SDK"/build-tools/* | sort -V | tail -1)"
          if [ -n "$KEYSTORE_B64" ]; then
            gradle assembleRelease --no-daemon --stacktrace
            KS="$RUNNER_TEMP/signer.jks"
            echo "$KEYSTORE_B64" | base64 -d > "$KS"
            "$BT/zipalign" -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
            "$BT/apksigner" sign --ks "$KS" --ks-pass env:KEYSTORE_PASSWORD --ks-key-alias "$KEY_ALIAS" \
              --out "$RUNNER_TEMP/signed.apk" "$RUNNER_TEMP/aligned.apk"
            rm -f "$KS"
            "$BT/apksigner" verify --print-certs "$RUNNER_TEMP/signed.apk" | grep -i "SHA-256" | tee "$RUNNER_TEMP/cert.txt"
            # Once pinned, a build signed with any other key fails here.
            if [ -f signing-cert.sha256 ]; then
              PINNED="$(grep -v '^#' signing-cert.sha256 | tr -d ': \n' | tr 'A-F' 'a-f')"
              ACTUAL="$(grep -i 'Signer #1 certificate SHA-256' "$RUNNER_TEMP/cert.txt" | sed -E 's/.*: *//' | tr -d ': ' | tr 'A-F' 'a-f')"
              if [ "$PINNED" != "$ACTUAL" ]; then
                echo "::error::The APK was signed with a different key than the one pinned in android/signing-cert.sha256"
                exit 1
              fi
              echo "Signing certificate matches the pinned one."
            fi
            echo "CERT_FILE=$RUNNER_TEMP/cert.txt" >> "$GITHUB_ENV"
            echo "APK=$RUNNER_TEMP/signed.apk" >> "$GITHUB_ENV"
            echo "APK_KIND=release, signed with the owner's key" >> "$GITHUB_ENV"
          else
            gradle assembleDebug --no-daemon --stacktrace
            echo "APK=$GITHUB_WORKSPACE/android/app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_ENV"
            echo "APK_KIND=debug (no signing key set: updates need an uninstall)" >> "$GITHUB_ENV"
          fi

      - name: Guard - only the reviewed permissions, never internet
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          AAPT2="$(ls -d "$SDK"/build-tools/* | sort -V | tail -1)/aapt2"
          "$AAPT2" dump permissions "$APK" | tee permissions.txt
          if grep -q "android.permission.INTERNET" permissions.txt; then
            echo "::error::The signer APK requests INTERNET permission"
            exit 1
          fi
          # Exactly these may be requested (a library adding any other
          # permission fails the build until it is reviewed).
          ALLOWED='^(android\.permission\.ACCESS_NETWORK_STATE|android\.permission\.CAMERA|android\.permission\.DETECT_SCREEN_RECORDING|com\.vipgarg\.walletsigner\.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION)$'
          grep "^uses-permission:" permissions.txt | sed -E "s/.*name='([^']+)'.*/\1/" | sort -u > requested.txt
          cat requested.txt
          if grep -Ev "$ALLOWED" requested.txt; then
            echo "::error::The signer APK requests a permission that isn't on the reviewed list (above)"
            exit 1
          fi

      - name: Name and hash the APK
        run: |
          mkdir -p out
          NAME="wallet-signer-testnet-${GITHUB_SHA::7}.apk"
          cp "$APK" "out/$NAME"
          echo "Build: $APK_KIND"
          if [ -n "${CERT_FILE:-}" ]; then cp "$CERT_FILE" "out/signing-cert.txt"; cat out/signing-cert.txt; fi
          (cd out && sha256sum "$NAME" | tee "$NAME.sha256")

      - uses: actions/upload-artifact@v4
        with:
          name: wallet-signer-testnet-${{ github.sha }}
          path: out/
          if-no-files-found: error
