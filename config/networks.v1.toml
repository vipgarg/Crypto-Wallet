# Network configuration, version 1 (ARCHITECTURE.md §9.6).
#
# This file is compiled into the app, and the app shows its SHA-256 on the
# About screen. Any change to it must go through a reviewed release.
# (Release signing of this file is a later step; see §9.6.)
#
# Provider rules (§5.5):
# - At least 2 providers per network, from DIFFERENT companies on different
#   infrastructure. A single provider's answer is shown as "unverified".
#   A third provider keeps balances verifiable when one is down; all answers
#   must still be identical (any difference = "sources disagree").
# - Providers only supply data. Contract addresses below are pinned here and
#   are never taken from a provider.
# - HTTPS only.
#
# STATUS: the provider URLs below are starting points. Before using real funds,
# confirm on your own PC that each one answers, check who operates it, and
# record the result in docs/release-gate.md. Replace any that don't work.

version = 1

[pinned]
# USDT on Ethereum (ERC-20). Re-verify from 3 sources before each release
# (Tether transparency page, Etherscan verified contract, bytecode hash).
usdt_erc20 = "0xdAC17F958D2ee523a2206206994597C13D831ec7"
eth_chain_id = 1
# USDT on TRON (TRC-20). Verify against Tether's site and Tronscan.
usdt_trc20 = "TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t"
# TRON Nile TEST network USDT (no value; Phase 2 testing only). From TRON's
# wallet-cli token list for Nile ("official", 6 decimals). Also compiled
# into the tablet app, which signs only this contract in the test build.
usdt_trc20_nile = "TXYZopYRdj2D9XRtbG411XZZ3kM5VkAeBf"

[[providers]]
id = "mempool-space"
network = "bitcoin"
kind = "esplora"
base_url = "https://mempool.space/api"
operator = "mempool.space"

[[providers]]
id = "blockstream"
network = "bitcoin"
kind = "esplora"
base_url = "https://blockstream.info/api"
operator = "Blockstream"
# Also used for Bitcoin history (per-address transaction lists). History
# comes from one source at a time and is labelled as such.
features = ["address_history"]

[[providers]]
# Third Bitcoin source, so one slow or rate-limited provider no longer leaves
# Bitcoin "unverified": the other two must still agree exactly. A public
# mempool instance run independently of mempool.space (same open-source
# software, different operator and servers).
id = "emzy-mempool"
network = "bitcoin"
kind = "esplora"
base_url = "https://mempool.emzy.de/api"
operator = "Emzy (independent mempool instance)"
features = ["address_history"]

[[providers]]
id = "publicnode-eth"
network = "ethereum"
kind = "eth_json_rpc"
base_url = "https://ethereum-rpc.publicnode.com"
operator = "PublicNode (Allnodes)"

[[providers]]
id = "drpc-eth"
network = "ethereum"
kind = "eth_json_rpc"
base_url = "https://eth.drpc.org"
operator = "dRPC"

[[providers]]
id = "1rpc-eth"
network = "ethereum"
kind = "eth_json_rpc"
base_url = "https://1rpc.io/eth"
operator = "1RPC (Automata Network)"

[[providers]]
# Ethereum HISTORY only (token transfers and the address's transactions).
# Kind "blockscout" is never asked for balances, so it can't make a balance
# "verified"; history from it is shown as single-source information.
id = "blockscout-eth"
network = "ethereum"
kind = "blockscout"
base_url = "https://eth.blockscout.com"
operator = "Blockscout"
features = ["erc20_history", "account_history"]

[[providers]]
id = "trongrid"
network = "tron"
kind = "tron_http"
base_url = "https://api.trongrid.io"
operator = "TronGrid (TRON DAO)"
# TronGrid also indexes history (/v1 API): TRC-20 transfers and the account's
# transactions. History comes from this single source and is shown as such;
# balances are still cross-checked.
features = ["trc20_history", "account_history"]

[[providers]]
id = "publicnode-tron"
network = "tron"
kind = "tron_http"
base_url = "https://tron-rpc.publicnode.com"
operator = "PublicNode (Allnodes)"

# ---------------------------------------------------------------------------
# Bitcoin SIGNET: a public TEST network whose coins have no value. Used only
# for Phase 2 testing (sending from test wallets). Never used for real
# wallets or balances.
[[signet_providers]]
id = "mempool-space-signet"
base_url = "https://mempool.space/signet/api"
operator = "mempool.space"

[[signet_providers]]
id = "emzy-signet"
base_url = "https://mempool.emzy.de/signet/api"
operator = "Emzy (independent mempool instance)"

# ---------------------------------------------------------------------------
# TRON NILE: a public TEST network whose coins have no value. Phase 2 testing
# only. TronGrid's Nile node (listed in TRON's wallet-cli network table).
# Only one public operator is known, so Nile data is single-source and the
# app says so; real (mainnet) balances keep using two providers.
[[nile_providers]]
id = "trongrid-nile"
base_url = "https://nile.trongrid.io"
operator = "TronGrid (TRON DAO)"
